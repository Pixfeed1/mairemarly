<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../squelettes/css/theme.css">
<style>
 body{margin:0;background:#fff;font:13px system-ui;padding:28px;color:#1D1A1A}
 .rangee{display:flex;align-items:flex-end;gap:34px;margin-bottom:26px}
 figure{margin:0;text-align:center} figcaption{margin-top:8px;font-size:11px;color:#55504A}
 .sombre{background:#1E5B41;color:#fff;padding:24px;border-radius:4px}
</style></head><body>
<p><b>Sceau complet</b> — en-tête, papier en-tête, panneaux</p>
<div class="rangee" id="clair"></div>
<p><b>Variante compacte</b> — favicon, icône, pastille</p>
<div class="rangee" id="compact"></div>
<div class="sombre">
  <p style="margin:0 0 12px">Sur fond de couleur</p>
  <div class="rangee" id="sombre" style="margin-bottom:18px"></div>
  <div class="rangee" id="sombre-compact" style="margin-bottom:0"></div>
</div>
<script>
const rendre = (svg, tailles, cible) =>
  document.getElementById(cible).innerHTML = tailles.map(t =>
    `<figure>${svg.replace('width="100" height="100"', `width="${t}" height="${t}"`)}
     <figcaption>${t} px</figcaption></figure>`).join('');

Promise.all([
  fetch('../squelettes/img/embleme-saint-remy.svg').then(r => r.text()),
  fetch('../squelettes/img/embleme-compact.svg').then(r => r.text())
]).then(([complet, compact]) => {
  rendre(complet, [48, 72, 120, 160], 'clair');
  rendre(compact, [16, 24, 32, 48, 72], 'compact');
  rendre(complet, [72, 120], 'sombre');
  rendre(compact, [24, 32, 48], 'sombre-compact');
});
</script></body></html>
