<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"
     role="img" aria-label="Emblème de Marly-Gomont : l’église fortifiée Saint-Rémy">
  <!-- Sceau bâti autour de l'église fortifiée Saint-Rémy, monument historique
       classé par arrêté du 3 février 1928. Dessin original au trait : à la
       taille d'un en-tête, une silhouette pleine se referme et devient une
       tache, alors qu'un tracé garde ses détails.

       Éléments retenus, tous attestés : les tours défensives qui flanquent la
       façade, le portail en tiers-point, les ouvertures étroites. -->
  <g fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- tours flanquantes -->
    <path d="M30 72 V50 l6-8 6 8 v22"/>
    <path d="M58 72 V50 l6-8 6 8 v22"/>
    <path d="M34 54 v5 M64 54 v5"/>

    <!-- corps de la façade et pignon -->
    <path d="M42 72 V48 l8-10 8 10 v24"/>

    <!-- portail en tiers-point : deux arcs qui se rejoignent en pointe -->
    <path d="M45 72 V62 Q45 55 50 53 Q55 55 55 62 V72"/>

    <!-- ouvertures étroites de la façade -->
    <path d="M50 44 v4"/>

    <!-- soubassement -->
    <path d="M26 72 H74"/>
  </g>

  <!-- couronne : le nom -->
  <path id="arcNom" d="M 14 50 A 36 36 0 0 1 86 50" fill="none"/>
  <text font-family="Alegreya Sans, Georgia, sans-serif" font-size="12" font-weight="700"
        letter-spacing="1.1" fill="currentColor">
    <textPath href="#arcNom" startOffset="50%" text-anchor="middle">MARLY-GOMONT</textPath>
  </text>
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="50" cy="50" r="40"   fill="none" stroke="currentColor" stroke-width="0.9"/>
</svg>
