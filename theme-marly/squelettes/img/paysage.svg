<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="260" viewBox="0 0 1440 260"
     role="img" aria-label="Silhouette de bocage et d'église fortifiée de Thiérache">
  <!-- Bande de paysage ancrée en bas : elle garde ses proportions quelle que
       soit la hauteur du héros, contrairement à une scène plein cadre. -->
  <g fill="#123F2D" opacity=".55">
    <path d="M0 120 Q 300 84 600 108 T 1140 96 T 1440 112 V260 H0 Z"/>
  </g>
  <g fill="#0E3324" opacity=".8">
    <path d="M0 168 Q 360 138 760 162 T 1440 150 V260 H0 Z"/>
  </g>
  <!-- Église fortifiée : l'emblème de la Thiérache -->
  <g fill="#08211A">
    <path d="M660 190 V126 l30-28 30 28 v64 z"/>
    <rect x="681" y="158" width="18" height="32" fill="#0E3324"/>
    <rect x="628" y="150" width="32" height="40"/>
    <rect x="720" y="150" width="32" height="40"/>
    <path d="M690 84 v18 M681 92 h18" stroke="#08211A" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Haies et arbres du bocage -->
  <g fill="#08211A">
    <ellipse cx="232" cy="150" rx="46" ry="30"/><rect x="228" y="150" width="8" height="26"/>
    <ellipse cx="392" cy="164" rx="30" ry="21"/><rect x="389" y="164" width="6" height="18"/>
    <ellipse cx="1108" cy="156" rx="52" ry="34"/><rect x="1104" y="156" width="9" height="28"/>
    <ellipse cx="1268" cy="170" rx="34" ry="23"/><rect x="1265" y="170" width="7" height="19"/>
  </g>
  <g fill="#08211A" opacity=".9">
    <path d="M0 196 Q 380 176 800 194 T 1440 184 V260 H0 Z"/>
  </g>
</svg>
