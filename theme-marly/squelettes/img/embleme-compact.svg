<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"
     role="img" aria-label="Marly-Gomont">
  <!-- Variante compacte, pour les petites tailles : favicon, icône
       d'application, pastille de réseau social.

       Le nom en couronne disparaît — mesuré : illisible sous 48px — et la
       façade prend toute la place. Les traits sont épaissis parce qu'un trait
       de 2 unités à 16px ne fait plus qu'un tiers de pixel et s'efface.
       Trois éléments seulement : les deux tours coiffées et le pignon. -->
  <g fill="none" stroke="currentColor" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 76 V46"/>
    <path d="M36 76 V46"/>
    <path d="M18 46 L28 30 L38 46"/>

    <path d="M64 76 V46"/>
    <path d="M80 76 V46"/>
    <path d="M62 46 L72 30 L82 46"/>

    <path d="M36 76 V44 L50 22 L64 44 v32"/>
    <path d="M44 76 V62 Q44 54 50 53 Q56 54 56 62 v14"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="4"/>
</svg>
